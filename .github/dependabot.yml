version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      routine-development:
        patterns:
          - '*'
        # Puppeteer minor releases roll bundled Chrome and need isolated E2E review.
        exclude-patterns:
          - puppeteer
        dependency-type: development
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    groups:
      # One PR lets CI validate interacting Action upgrades together.
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 2
    labels:
      - dependencies
